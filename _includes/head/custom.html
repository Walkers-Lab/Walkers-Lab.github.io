<!-- Custom <head> additions (Minimal Mistakes includes this file automatically) -->

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

{% if site.cloudflare_analytics_token and site.cloudflare_analytics_token != "" %}
<!-- Cloudflare Web Analytics -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.cloudflare_analytics_token }}"}'></script>
<!-- End Cloudflare Web Analytics -->
{% endif %}
